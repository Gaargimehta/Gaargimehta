<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#101426" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="160" rx="10" fill="url(#minBg)" stroke="#1E293B" stroke-width="1" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="0" y1="80" x2="1000" y2="80" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="0" y1="120" x2="1000" y2="120" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="200" y1="0" x2="200" y2="160" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="400" y1="0" x2="400" y2="160" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="600" y1="0" x2="600" y2="160" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="800" y1="0" x2="800" y2="160" stroke="#38BDF8" stroke-width="0.8" />
  </g>

  <!-- Status Chip -->
  <g transform="translate(48, 28)">
    <circle cx="6" cy="6" r="3.5" fill="#10B981" />
    <text x="18" y="9.5" fill="#94A3B8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">INTELLIGENT SYSTEMS · AI &amp; MACHINE LEARNING</text>
  </g>

  <!-- Primary Name -->
  <text x="48" y="85" fill="#F8FAFC" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Gargi Mehta</text>

  <!-- Subtitle -->
  <text x="48" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    B.Tech in Computer Science Engineering (AI &amp; ML) · SRM Institute of Science and Technology, Kattankulathur
  </text>

  <!-- Right-aligned coordinate telemetry -->
  <text x="952" y="85" fill="#475569" font-family="monospace" font-size="11" text-anchor="end">SRMIST KTR // 12.8230° N, 80.0444° E</text>
  <text x="952" y="115" fill="#22D3EE" font-family="monospace" font-size="11" text-anchor="end">CLASS OF 2027</text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="157" width="1000" height="3" fill="url(#accentLine)" />
</svg>
