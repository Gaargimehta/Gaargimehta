<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#080e29" />
      <stop offset="80%" stop-color="#0f0728" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPink" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Text Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <style>
    .star { fill: #ffffff; opacity: 0.8; }
    .star-twinkle { animation: twinkle 4s ease-in-out infinite; }
    .star-twinkle-alt { animation: twinkle 3s ease-in-out infinite 1.5s; }
    .orbit { fill: none; stroke: rgba(56, 189, 248, 0.18); stroke-width: 1.2; stroke-dasharray: 6 8; }
    .orbit-solid { fill: none; stroke: rgba(168, 85, 247, 0.25); stroke-width: 1.5; }
    .hud-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #38bdf8; letter-spacing: 3px; font-weight: 600; }
    .hero-title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 56px; font-weight: 800; letter-spacing: 2px; }
    .hero-sub { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #94a3b8; letter-spacing: 3px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 500; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>

  <!-- Deep Cosmos Base -->
  <rect width="1200" height="420" fill="url(#spaceGrad)" rx="16" />

  <!-- Nebula Dust Clouds -->
  <rect width="1200" height="420" fill="url(#nebulaCyan)" rx="16" />
  <rect width="1200" height="420" fill="url(#nebulaPurple)" rx="16" />
  <rect width="1200" height="420" fill="url(#nebulaPink)" rx="16" />

  <!-- Grid Overlay (Subtle Cyber Grid) -->
  <g opacity="0.12">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#38bdf8" stroke-width="0.7" />

    <line x1="150" y1="0" x2="150" y2="420" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="300" y1="0" x2="300" y2="420" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="450" y1="0" x2="450" y2="420" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="600" y1="0" x2="600" y2="420" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="750" y1="0" x2="750" y2="420" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="900" y1="0" x2="900" y2="420" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke="#38bdf8" stroke-width="0.7" />
  </g>

  <!-- Constellation Nodes & Links (Left Cluster) -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="80" x2="190" y2="130" />
    <line x1="190" y1="130" x2="260" y2="90" />
    <line x1="190" y1="130" x2="150" y2="210" />
    <line x1="150" y1="210" x2="80" y2="240" />
    <line x1="260" y1="90" x2="340" y2="150" />
    <line x1="150" y1="210" x2="230" y2="270" />

    <circle cx="120" cy="80" r="3" fill="#38bdf8" />
    <circle cx="190" cy="130" r="4" fill="#c084fc" />
    <circle cx="260" cy="90" r="3.5" fill="#38bdf8" />
    <circle cx="150" cy="210" r="4.5" fill="#38bdf8" />
    <circle cx="80" cy="240" r="2.5" fill="#818cf8" />
    <circle cx="340" cy="150" r="3" fill="#c084fc" />
    <circle cx="230" cy="270" r="4" fill="#38bdf8" />
  </g>

  <!-- Planetary Celestial Circles (Right Cluster) -->
  <g transform="translate(1030, 210)">
    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="160" ry="85" class="orbit" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="210" ry="110" class="orbit" transform="rotate(-25)" opacity="0.6" />
    <circle cx="0" cy="0" r="65" class="orbit-solid" />
    
    <!-- Central Glowing Core -->
    <circle cx="0" cy="0" r="45" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="url(#accentGrad)" opacity="0.75" filter="url(#subtleGlow)" />
    
    <!-- Satellite Nodes on Orbit -->
    <circle cx="-130" cy="-45" r="7" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="140" cy="50" r="5" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle cx="70" cy="-80" r="4" fill="#ec4899" />
  </g>

  <!-- Twinkling Starfield -->
  <g class="star-twinkle">
    <circle cx="65" cy="45" r="1.5" class="star" />
    <circle cx="220" cy="350" r="1.8" class="star" />
    <circle cx="480" cy="55" r="1.4" class="star" />
    <circle cx="620" cy="360" r="2" class="star" />
    <circle cx="820" cy="85" r="1.5" class="star" />
    <circle cx="1120" cy="70" r="1.7" class="star" />
    <circle cx="1150" cy="330" r="1.5" class="star" />
    <circle cx="90" cy="370" r="1.2" class="star" />
    <circle cx="390" cy="330" r="1.5" class="star" />
  </g>
  <g class="star-twinkle-alt">
    <circle cx="140" cy="310" r="1.2" class="star" />
    <circle cx="310" cy="60" r="2.2" class="star" />
    <circle cx="560" cy="32" r="1.3" class="star" />
    <circle cx="740" cy="375" r="1.8" class="star" />
    <circle cx="890" cy="40" r="1.4" class="star" />
    <circle cx="980" cy="340" r="2.1" class="star" />
    <circle cx="430" cy="375" r="1.2" class="star" />
  </g>

  <!-- Top HUD Status Banner -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="340" height="28" rx="14" fill="#0b1329" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" filter="url(#subtleGlow)" />
    <text x="32" y="18" class="hud-text" font-size="9.5" fill="#38bdf8">SYSTEM ONLINE // NEURAL HORIZON</text>
  </g>

  <!-- Header Coordinates / Telemetry -->
  <g transform="translate(850, 48)">
    <text x="290" y="18" class="hud-text" font-size="10" text-anchor="end" fill="#94a3b8">SRMIST KTR // 12.8230° N, 80.0444° E</text>
  </g>

  <!-- Main Hero Title Group -->
  <g transform="translate(60, 150)">
    <!-- Subtitle Pill -->
    <text x="2" y="0" class="hud-text">EXPLORING INTELLIGENT SYSTEMS &amp; SUSTAINABLE AI</text>
    
    <!-- Big Headline Name -->
    <text x="0" y="65" class="hero-title" fill="url(#textGrad)" filter="url(#subtleGlow)">GARGI MEHTA</text>
    
    <!-- Role Subheading -->
    <text x="2" y="105" class="hero-sub">AI/ML DEVELOPER <tspan fill="#38bdf8">✦</tspan> RESEARCH ENTHUSIAST <tspan fill="#a855f7">✦</tspan> FUTURE AI ENGINEER</text>
  </g>

  <!-- Bottom Metadata Badges / Chips -->
  <g transform="translate(60, 315)">
    <!-- Chip 1: Degree -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="#0b132b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">🎓 B.Tech CSE (AI/ML) '27</text>
    </g>

    <!-- Chip 2: Institution -->
    <g transform="translate(225, 0)">
      <rect width="180" height="34" rx="8" fill="#0b132b" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">🏛️ SRMIST KTR, Chennai</text>
    </g>

    <!-- Chip 3: Research Focus -->
    <g transform="translate(420, 0)">
      <rect width="250" height="34" rx="8" fill="#0b132b" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">⚡ ML Attestation &amp; Multilingual NLP</text>
    </g>

    <!-- Chip 4: Experience Highlight -->
    <g transform="translate(685, 0)">
      <rect width="240" height="34" rx="8" fill="#0b132b" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="14" y="22" class="badge-text">🌐 Ex-GenAI Intern @ Google Cloud</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
